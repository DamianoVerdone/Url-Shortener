buildscript {

    repositories {
        jcenter()
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()

    }
    dependencies {

        classpath "io.spring.gradle:dependency-management-plugin:1.0.11.RELEASE"
    }

}

subprojects {
    apply plugin: 'java'
    apply plugin: "io.spring.dependency-management"

    sourceCompatibility = 1.11
    targetCompatibility=1.11
    group = 'net.translated'
    version = '0.0.1'

    repositories {
        jcenter()
        mavenLocal()
    }


    dependencyManagement {
        dependencies {
            dependencySet(group: 'org.apache.activemq', version: '5.16.1') {
                entry 'activemq-client'
                entry 'activemq-pool'

            }
            dependencySet(  group: 'ch.qos.logback',  version: '1.2.3') {
                entry  'logback-classic'
                entry  'logback-core'
            }

        }



    }
    test {
        useJUnitPlatform()
    }


}