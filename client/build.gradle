apply plugin: "io.spring.dependency-management"
apply plugin: 'java'



dependencies {

    implementation project(':model')
    implementation 'org.apache.activemq:activemq-client'
    implementation 'org.apache.activemq:activemq-pool'
    implementation group: 'org.slf4j', name: 'jcl-over-slf4j', version: '1.7.7'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.3'
    implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.2.3'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.12.3'

    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.6.2'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.6.2'



}

jar {
    manifest {
        attributes(
                'Main-Class': 'net.traslated.Client'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}


buildDir = './build'
